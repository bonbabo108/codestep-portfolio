<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8edf2" stroke-width="0.7"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7888"/></marker></defs><rect width="1400" height="1040" fill="#ffffff"/><rect width="1400" height="1040" fill="url(#grid)"/>
<text x="70" y="59" font-size="31" font-weight="700" text-anchor="start" fill="#223044">CodeStep ER図（現行の公開データ構成）</text>
<text x="70" y="89" font-size="17" font-weight="400" text-anchor="start" fill="#223044">公開スキーマは3テーブル。認証用メール・パスワードはSupabase Authが別管理します。</text>
<rect x="80" y="115" width="520" height="206" rx="7" fill="#ffffff" stroke="#737f8e" stroke-width="2"/><rect x='81' y='116' width='518' height='52' rx='6' fill='#f2f5f8'/><text x="340" y="149" font-size="25" font-weight="700" text-anchor="middle" fill="#1f2937">profiles （公開テーブル）</text><path d="M 80 172 L 600 172" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="98" y="203" font-size="17" font-weight="600" text-anchor="start" fill="#223044">id</text><text x="314" y="203" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">uuid · PK</text><path d="M 80 219 L 600 219" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="98" y="250" font-size="17" font-weight="600" text-anchor="start" fill="#223044">name</text><text x="314" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NOT NULL</text><path d="M 80 266 L 600 266" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="98" y="297" font-size="17" font-weight="600" text-anchor="start" fill="#223044">created_at</text><text x="314" y="297" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">timestamptz · DEFAULT now()</text><text x="94" y="350" font-size="15" font-weight="400" text-anchor="start" fill="#4b5563">利用者プロフィール</text><rect x="730" y="115" width="575" height="347" rx="7" fill="#ffffff" stroke="#737f8e" stroke-width="2"/><rect x='731' y='116' width='573' height='52' rx='6' fill='#f2f5f8'/><text x="1017.5" y="149" font-size="25" font-weight="700" text-anchor="middle" fill="#1f2937">user_progress （公開テーブル）</text><path d="M 730 172 L 1305 172" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="203" font-size="17" font-weight="600" text-anchor="start" fill="#223044">id</text><text x="964" y="203" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">uuid · PK</text><path d="M 730 219 L 1305 219" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="250" font-size="17" font-weight="600" text-anchor="start" fill="#223044">user_id</text><text x="964" y="250" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">uuid · FK → profiles.id</text><path d="M 730 266 L 1305 266" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="297" font-size="17" font-weight="600" text-anchor="start" fill="#223044">question_id</text><text x="964" y="297" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">uuid · FK → questions.id</text><path d="M 730 313 L 1305 313" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="344" font-size="17" font-weight="600" text-anchor="start" fill="#223044">submitted_code</text><text x="964" y="344" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NULL可</text><path d="M 730 360 L 1305 360" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="391" font-size="17" font-weight="600" text-anchor="start" fill="#223044">is_completed</text><text x="964" y="391" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">boolean · DEFAULT false</text><path d="M 730 407 L 1305 407" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="438" font-size="17" font-weight="600" text-anchor="start" fill="#223044">updated_at</text><text x="964" y="438" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">timestamptz · DEFAULT now()</text><text x="744" y="491" font-size="15" font-weight="400" text-anchor="start" fill="#4b5563">UNIQUE (user_id, question_id) · 同じ問題の進捗重複を防止</text><rect x="730" y="580" width="575" height="394" rx="7" fill="#ffffff" stroke="#737f8e" stroke-width="2"/><rect x='731' y='581' width='573' height='52' rx='6' fill='#f2f5f8'/><text x="1017.5" y="614" font-size="25" font-weight="700" text-anchor="middle" fill="#1f2937">questions （公開テーブル）</text><path d="M 730 637 L 1305 637" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="668" font-size="17" font-weight="600" text-anchor="start" fill="#223044">id</text><text x="964" y="668" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">uuid · PK</text><path d="M 730 684 L 1305 684" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="715" font-size="17" font-weight="600" text-anchor="start" fill="#223044">title</text><text x="964" y="715" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NOT NULL</text><path d="M 730 731 L 1305 731" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="762" font-size="17" font-weight="600" text-anchor="start" fill="#223044">question_text</text><text x="964" y="762" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NOT NULL</text><path d="M 730 778 L 1305 778" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="809" font-size="17" font-weight="600" text-anchor="start" fill="#223044">answer_code</text><text x="964" y="809" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NOT NULL</text><path d="M 730 825 L 1305 825" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="856" font-size="17" font-weight="600" text-anchor="start" fill="#223044">explanation</text><text x="964" y="856" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NULL可</text><path d="M 730 872 L 1305 872" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="903" font-size="17" font-weight="600" text-anchor="start" fill="#223044">category</text><text x="964" y="903" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">text · NULL可</text><path d="M 730 919 L 1305 919" fill="none" stroke="#d2d9e1" stroke-width="1" /><text x="748" y="950" font-size="17" font-weight="600" text-anchor="start" fill="#223044">created_at</text><text x="964" y="950" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">timestamptz · DEFAULT now()</text><text x="744" y="1003" font-size="15" font-weight="400" text-anchor="start" fill="#4b5563">公開問題・正解・解説を保存</text>
<path d="M 600 231 L 730 231" fill="none" stroke="#697888" stroke-width="3" marker-end="url(#arrow)"/>
<text x="662" y="212" font-size="17" font-weight="600" text-anchor="middle" fill="#223044">1 対 多</text>
<path d="M 1040 460 V 580" fill="none" stroke="#697888" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1055" y="526" font-size="17" font-weight="600" text-anchor="start" fill="#223044">多 対 1</text>
<rect x="80" y="440" width="520" height="237" rx="7" fill="#f8fafc" stroke="#ccd5df" stroke-width="2"/>
<text x="105" y="484" font-size="24" font-weight="700" text-anchor="start" fill="#223044">Supabase Auth（認証サービス）</text>
<text x="105" y="525" font-size="19" font-weight="400" text-anchor="start" fill="#223044">auth.users にメールアドレス等を管理</text>
<text x="105" y="561" font-size="17" font-weight="400" text-anchor="start" fill="#223044">パスワード・セッション・JWTはAuthが担当</text>
<text x="105" y="601" font-size="17" font-weight="400" text-anchor="start" fill="#223044">profiles.idには同じ利用者UUIDを使用</text>
<text x="105" y="637" font-size="16" font-weight="400" text-anchor="start" fill="#223044">※ Auth → profiles 間にDB外部キーはありません</text>
<rect x="80" y="734" width="520" height="160" rx="7" fill="#f8fafc" stroke="#ccd5df" stroke-width="2"/>
<text x="105" y="778" font-size="24" font-weight="700" text-anchor="start" fill="#223044">関係と制約</text>
<text x="105" y="818" font-size="17" font-weight="400" text-anchor="start" fill="#223044">進捗は本人と問題の両方に紐づきます</text>
<text x="105" y="856" font-size="17" font-weight="400" text-anchor="start" fill="#223044">外部キー2本：NO ACTION（CASCADEなし）</text>
<text x="80" y="1008" font-size="16" font-weight="400" text-anchor="start" fill="#223044">図の意味：実際のDBのテーブル・列・FK構成に合わせて記載。RLS（アクセス制限）は別途設定。</text>
</svg>