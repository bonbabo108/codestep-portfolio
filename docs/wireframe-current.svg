<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850">
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8edf2" stroke-width="0.7"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7888"/></marker></defs><rect width="1800" height="850" fill="#ffffff"/><rect width="1800" height="850" fill="url(#grid)"/>
<text x="45" y="58" font-size="31" font-weight="700" text-anchor="start" fill="#223044">CodeStep ワイヤーフレーム（現行画面構成）</text>
<text x="45" y="92" font-size="18" font-weight="400" text-anchor="start" fill="#223044">ログイン・学習・管理を中心とした元の横並び構成を維持し、URLとデモ導線を更新</text>
<rect x="50" y="160" width="410" height="244" rx="10" fill="#ffffff" stroke="#7d8997" stroke-width="2"/><rect x="51" y="161" width="408" height="49" rx="9" fill="#eef2f6"/><text x="66" y="194" font-size="22" font-weight="700" text-anchor="start" fill="#223044">登録・ログイン /login</text><text x="70" y="242" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・メールアドレス・パスワード入力</text><text x="70" y="274" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・同じ画面で登録／ログイン切替</text><text x="70" y="306" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・登録後、学習画面へ進む</text><text x="70" y="338" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・確認メールは現在必須ではない</text>
<rect x="660" y="160" width="450" height="295" rx="10" fill="#ffffff" stroke="#7d8997" stroke-width="2"/><rect x="661" y="161" width="448" height="49" rx="9" fill="#eef2f6"/><text x="676" y="194" font-size="22" font-weight="700" text-anchor="start" fill="#223044">学習画面 /</text><text x="680" y="242" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・学習問題・カテゴリを表示</text><text x="680" y="274" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・解答コードを入力</text><text x="680" y="306" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・「回答をチェック」→正誤・解説</text><text x="680" y="338" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・ログイン本人の正解を保存・復元</text><text x="680" y="370" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・管理画面・デモへのリンク</text>
<rect x="1305" y="160" width="445" height="295" rx="10" fill="#ffffff" stroke="#7d8997" stroke-width="2"/><rect x="1306" y="161" width="443" height="49" rx="9" fill="#eef2f6"/><text x="1321" y="194" font-size="22" font-weight="700" text-anchor="start" fill="#223044">問題管理 /admin</text><text x="1325" y="242" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・管理者権限を確認（/admin/login）</text><text x="1325" y="274" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・問題の作成・登録済み一覧</text><text x="1325" y="306" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・編集・削除（事前の確認あり）</text><text x="1325" y="338" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・一般利用者の管理操作は拒否</text>
<path d="M 460 260 L 660 260" fill="none" stroke="#718195" stroke-width="4" marker-end="url(#arrow)"/><text x="560" y="238" font-size="16" font-weight="600" text-anchor="middle" fill="#223044">登録・ログイン後</text>
<path d="M 1110 260 L 1305 260" fill="none" stroke="#718195" stroke-width="4" marker-end="url(#arrow)"/><text x="1203" y="225" font-size="16" font-weight="600" text-anchor="middle" fill="#223044">管理者のみ</text>
<path d="M 1305 323 L 1110 323" fill="none" stroke="#718195" stroke-width="2" marker-end="url(#arrow)"/><text x="1203" y="347" font-size="16" font-weight="400" text-anchor="middle" fill="#223044">学習へ戻る</text>
<rect x="660" y="580" width="450" height="198" rx="10" fill="#ffffff" stroke="#7d8997" stroke-width="2"/><rect x="661" y="581" width="448" height="49" rx="9" fill="#eef2f6"/><text x="676" y="614" font-size="22" font-weight="700" text-anchor="start" fill="#223044">体験デモ /demo</text><text x="680" y="662" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・登録・ログイン不要</text><text x="680" y="694" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・架空問題への回答・正誤・解説</text><text x="680" y="726" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・実データベースへの書込なし</text>
<rect x="1305" y="580" width="445" height="198" rx="10" fill="#ffffff" stroke="#7d8997" stroke-width="2"/><rect x="1306" y="581" width="443" height="49" rx="9" fill="#eef2f6"/><text x="1321" y="614" font-size="22" font-weight="700" text-anchor="start" fill="#223044">管理画面デモ /demo/admin</text><text x="1325" y="662" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・架空問題の作成・編集・削除</text><text x="1325" y="694" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・通常管理画面と共通の操作感</text><text x="1325" y="726" font-size="17" font-weight="400" text-anchor="start" fill="#223044">・本番DB・管理者権限は使用しない</text>
<path d="M 895 455 V 580" fill="none" stroke="#718195" stroke-width="3" marker-end="url(#arrow)"/>
<text x="910" y="514" font-size="17" font-weight="400" text-anchor="start" fill="#223044">デモを開く</text>
<path d="M 1110 672 L 1305 672" fill="none" stroke="#718195" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1208" y="652" font-size="16" font-weight="600" text-anchor="middle" fill="#223044">デモ内で移動</text>
<text x="50" y="802" font-size="17" font-weight="400" text-anchor="start" fill="#223044">※ 入力途中のリアルタイムプレビューは未実装。現行はコード入力後の正誤判定・解説表示。</text>
</svg>